<div class="document-actions">
  <a class="button outline" href="$resume" download>Download résumé (PDF)</a>
  <a class="text-link" href="$resume" target="_blank" rel="noopener">Open PDF in a new tab</a>
</div>
<div class="document-frame">
  <object class="resume-document" data="$resume#toolbar=1&amp;navpanes=0&amp;view=FitH" type="application/pdf" aria-label="$name’s original one-page résumé">
    <a class="document-fallback" href="$resume" aria-label="Open the full résumé PDF">
      <img src="$preview" width="1224" height="1584" alt="First page of $name’s résumé. Open the PDF for selectable text." loading="lazy">
    </a>
  </object>
</div>
